<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
      .logo-text {
        font-family: 'Great Vibes', cursive;
        font-size: 60px;
        fill: #F9F6F0;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  
  <!-- The Rustic Terracotta Background -->
  <rect width="100" height="100" fill="#C07F67" rx="15" />
  
  <!-- The Cursive 'MB' -->
  <text x="50" y="52" class="logo-text">MB</text>
</svg>
